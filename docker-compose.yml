version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - ./backend/incidents:/app/incidents
      - ./backend/telegram_subscriptions.json:/app/telegram_subscriptions.json
      - ./backend/incidents.db:/app/incidents.db
    ports:
      - "8000:8000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
